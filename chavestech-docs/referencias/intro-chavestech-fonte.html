<script>
(function(){
  var KEY='ct-intro-visto', DUR=7.1;
  var root=document.getElementById('ct-intro'); if(!root) return;
  var qs=new URLSearchParams(location.search), RENDER=qs.has('render');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var seen=false; try{seen=sessionStorage.getItem(KEY)==='1'}catch(e){}
  if(!RENDER&&(reduce||seen)){root.remove();return}
  document.documentElement.style.overflow='hidden';

  var $=function(id){return document.getElementById(id)};
  var cl=function(x,a,b){a=a||0;b=b===undefined?1:b;return Math.min(b,Math.max(a,x))};
  var seg=function(t,a,b){return cl((t-a)/(b-a))};
  var eo=function(x){return 1-Math.pow(1-x,3)};                       // easeOutCubic
  var eio=function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};    // easeInOutCubic
  var back=function(x){var c=1.7,d=c+1;return 1+d*Math.pow(x-1,3)+c*Math.pow(x-1,2)}; // easeOutBack
  var mix=function(a,b,u){return Math.round(a+(b-a)*u)};
  var col=function(u){return 'rgb('+mix(91,230,u)+','+mix(140,234,u)+','+mix(255,240,u)+')'};

  var stage=root.querySelector('.ct-stage'), bg=root.querySelector('.ct-bg'), skip=root.querySelector('.ct-skip');
  var tg=root.querySelector('.ct-t'), tx=root.querySelector('.ct-tx'), rest=root.querySelector('.ct-rest'), cur=root.querySelector('.ct-cur'), typeBox=root.querySelector('.ct-type');
  var TXT=tx.getAttribute('data-text');
  // quebra a frase em palavras para montar uma por uma
  var words=tg.textContent.trim().split(/\s+/); tg.textContent='';
  var WS=words.map(function(w,i){var s=document.createElement('span');s.className='ct-w';s.textContent=w+(i<words.length-1?' ':'');tg.appendChild(s);return s});
  var blur=root.querySelector('#ct-glow feGaussianBlur'), sweep=$('ct-sweep-r');
  var P={}; ['bar','main','cres','lt','slash','gt','gt2'].forEach(function(n){P[n]=$('ct-'+n)});
  var L=[].slice.call(root.querySelectorAll('.ct-l'));
  var mainLen=P.main.getTotalLength();
  var W=+$('ct-logo').viewBox.baseVal.width;
  if(RENDER) skip.style.display='none';

  function piece(el,t,a,b,dx,dy){var u=seg(t,a,b),e=back(u);
    el.style.opacity=cl(u*2.2); el.style.transform='translate('+(dx*(1-e))+'px,'+(dy*(1-e))+'px)'}

  function render(t){
    // 1) logo (0–2s) · 2) frase (2–2,9s) + leitura até 4,3s · 3) tudo sai (4,3–4,9s)
    // 4) digita "Bem-vindo." (5–5,9s) · 5) cursor pisca · 6) saída final (6,5–7,1s)
    var out=eio(seg(t,4.3,4.9));
    var z=0.965+0.035*eo(seg(t,0,2.6))+0.015*eio(seg(t,2.6,4.3));
    stage.style.transform='translateY('+(-50*out)+'px) scale('+(z-0.04*out)+')';
    stage.style.opacity=1-out;
    stage.style.filter=out>0?'blur('+(out*8).toFixed(2)+'px)':'none';
    stage.style.visibility=out>=1?'hidden':'visible';
    var fin=eio(seg(t,6.5,6.95));
    bg.style.opacity=1-eio(seg(t,6.6,7.1));
    root.style.pointerEvents=t>=7.0?'none':'auto';
    skip.style.opacity=cl(seg(t,0.4,0.8)-fin);

    // digitação
    var n=Math.floor(cl((t-5.0)/0.09,0,TXT.length));
    tx.textContent=TXT.slice(0,n); rest.textContent=TXT.slice(n);
    var typing=t>=5.0&&n<TXT.length;
    var blink=(Math.floor((t-4.8)*2.6)%2===0)?1:0;
    cur.style.opacity=t<4.85?0:(typing?1:blink)*(1-fin);
    typeBox.style.opacity=1-fin;
    typeBox.style.transform='translateY(calc(-50% + '+(-24*fin)+'px)) scale('+(1+0.04*fin)+')';
    typeBox.style.filter=fin>0?'blur('+(fin*6).toFixed(2)+'px)':'none';

    // cor: azul durante a construção → claro no "ta-dum"
    var c=col(eio(seg(t,1.45,1.8)));
    Object.keys(P).forEach(function(n){P[n].style.fill=c});

    // barra cresce de baixo pra cima
    var ub=eo(seg(t,0.12,0.55));
    P.bar.style.transformOrigin='50% 100%'; P.bar.style.transform='scaleY('+ub+')'; P.bar.style.opacity=ub>0?1:0;

    // traço principal: desenha o contorno e depois preenche
    var ud=eio(seg(t,0.22,1.1));
    P.main.style.stroke='#5b8cff'; P.main.style.strokeWidth=9;
    P.main.style.strokeDasharray=mainLen; P.main.style.strokeDashoffset=mainLen*(1-ud);
    P.main.style.strokeOpacity=1-seg(t,1.3,1.6);
    P.main.style.fillOpacity=eo(seg(t,0.9,1.35));

    // meia-lua
    var uc=eo(seg(t,0.55,0.95));
    P.cres.style.opacity=uc; P.cres.style.transform='translate('+(-70*(1-uc))+'px,'+(40*(1-uc))+'px)';

    // código </> entrando em sequência
    piece(P.lt,t,0.85,1.15,90,0);
    piece(P.slash,t,0.95,1.25,0,-110);
    piece(P.gt,t,1.05,1.35,-90,0);
    piece(P.gt2,t,1.15,1.48,-140,0);

    // brilho + varredura de luz (o "ta-dum")
    var g=seg(t,1.4,1.62), gd=seg(t,1.62,2.1);
    blur.setAttribute('stdDeviation',(g*16*(1-gd)+5*gd*(t>1.4?1:0)).toFixed(2));
    var us=eio(seg(t,1.45,1.9));
    sweep.setAttribute('x',(-0.35*W+us*1.35*W).toFixed(1)); sweep.setAttribute('opacity',us>0&&us<1?1:0);

    // nome letra por letra
    L.forEach(function(el,j){var u=eo(seg(t,1.3+j*0.045,1.65+j*0.045));
      el.style.opacity=u; el.style.transform='translateY('+(450*(1-u))+'px)'});

    // frase palavra por palavra
    WS.forEach(function(el,i){var u=eo(seg(t,1.95+i*0.12,2.4+i*0.12));
      el.style.opacity=u; el.style.transform='translateY('+(18*(1-u))+'px)';
      el.style.filter=u<1?'blur('+((1-u)*6).toFixed(2)+'px)':'none'});
  }

  var done=false;
  function finish(){ if(done) return; done=true;
    try{sessionStorage.setItem(KEY,'1')}catch(e){}
    document.documentElement.style.overflow='';
    root.remove(); document.dispatchEvent(new CustomEvent('ct-intro-done')); }

  window.ctIntro={render:render,duration:DUR};
  render(0);
  if(RENDER) return;

  var t0=null, skipFrom=null;
  function frame(now){
    if(done) return;
    if(t0===null) t0=now;
    var t=(now-t0)/1000;
    if(skipFrom!==null) t=Math.max(t,6.5);            // pular = vai direto pra saída
    render(t);
    if(t>=DUR) finish(); else requestAnimationFrame(frame);
  }
  function doSkip(){ if(skipFrom===null){ skipFrom=1; t0=performance.now()-6.5*1000; } }
  root.addEventListener('click',doSkip);
  window.addEventListener('keydown',function(e){if(e.key==='Escape'||e.key===' '||e.key==='Enter')doSkip()},{once:true});
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){requestAnimationFrame(frame)});
})();
</script>
